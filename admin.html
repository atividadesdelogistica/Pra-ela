
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Administrativo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #fff0f4;
  color: #663044;
  font-family: Arial, sans-serif;
}

main {
  max-width: 600px;
  margin: auto;
}

h1, h2 {
  text-align: center;
}

.card {
  background: white;
  padding: 20px;
  margin: 18px 0;
  border-radius: 18px;
  box-shadow: 0 5px 20px #8b34501c;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  border: 1px solid #e5b5c5;
  border-radius: 10px;
  font-size: 15px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  background: #d94f7b;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.remove {
  background: #777;
}

.photo-card {
  background: #fff7fa;
  padding: 15px;
  margin: 15px 0;
  border: 1px solid #f0c9d5;
  border-radius: 14px;
}

.status {
  text-align: center;
  font-weight: bold;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<main>

<h1>Painel Administrativo</h1>
<p class="status">Edite as informações do seu site ❤️</p>

<section class="card">

<h2>Informações principais</h2>

<label>Título do site</label>
<input id="title" placeholder="Ex: Um mês de nós">

<label>Mensagem inicial</label>
<textarea id="intro" placeholder="Escreva uma mensagem..."></textarea>

<label>Data de início</label>
<input id="startDate" type="datetime-local">

</section>

<section class="card">

<h2>Nossas fotos</h2>

<p>Edite o título, a data e a história de cada lembrança.</p>

<div id="photos"></div>

<button type="button" id="addButton">
+ Adicionar outra foto
</button>

</section>

<section class="card">

<button type="button" id="saveButton">
SALVAR ALTERAÇÕES
</button>

<p id="status" class="status"></p>

</section>

</main>

<script type="module">

import {
  db,
  doc,
  getDoc,
  setDoc
} from "./firebase.js";

const photoDefaults = [
  {
    image: "fotos/0d171776-52c7-459d-b5cc-fc70e946272f.jpeg",
    name: "",
    date: "",
    story: ""
  },
  {
    image: "fotos/CDCBB916-F070-4EC8-89F6-167D5B1F0C15_BA3D15B9-6063-451A-B425-406ADCF6907A.jpeg",
    name: "",
    date: "",
    story: ""
  },
  {
    image: "fotos/IMG_6586.jpeg",
    name: "",
    date: "",
    story: ""
  },
  {
    image: "fotos/IMG_6593.jpeg",
    name: "",
    date: "",
    story: ""
  }
];

let photos = [];

const $ = (id) => document.getElementById(id);

function createPhotoCard(photo, index) {

  const div = document.createElement("div");
  div.className = "photo-card";

  div.innerHTML = `
    <h3>Foto ${index + 1}</h3>

    <label>Caminho da imagem</label>
    <input class="image" value="${escapeValue(photo.image || "")}">

    <label>Título da lembrança</label>
    <input class="name" placeholder="Ex: Nosso primeiro encontro"
      value="${escapeValue(photo.name || "")}">

    <label>Data da lembrança</label>
    <input class="date" placeholder="Ex: 04/10/2026"
      value="${escapeValue(photo.date || "")}">

    <label>História dessa foto</label>
    <textarea class="story"
      placeholder="Conte o que aconteceu nesse dia...">${escapeValue(photo.story || "")}</textarea>

    <button type="button" class="remove">Remover foto</button>
  `;

  div.querySelector(".remove").addEventListener("click", () => {
    div.remove();
    renumberPhotos();
  });

  $("photos").appendChild(div);
}

function escapeValue(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function renumberPhotos() {
  [...$("photos").children].forEach((card, index) => {
    card.querySelector("h3").textContent = "Foto " + (index + 1);
  });
}

function readPhotos() {

  return [...$("photos").children].map(card => ({
    image: card.querySelector(".image").value.trim(),
    name: card.querySelector(".name").value.trim(),
    date: card.querySelector(".date").value.trim(),
    story: card.querySelector(".story").value.trim()
  })).filter(photo => photo.image);
}

async function load() {

  $("status").textContent = "Carregando informações...";

  try {

    const reference = doc(db, "site", "config");
    const result = await getDoc(reference);

    if (result.exists()) {

      const data = result.data();

      $("title").value = data.title || "";
      $("intro").value = data.intro || "";
      $("startDate").value = data.startDate || "";

      photos = Array.isArray(data.photos)
        ? data.photos
        : [];

    } else {

      $("title").value = "Um mês de nós";
      $("intro").value =
        "Algumas pessoas chegam e deixam tudo mais bonito.";

      $("startDate").value = "2026-10-04T00:00";

      photos = photoDefaults;
    }

    $("photos").innerHTML = "";

    photos.forEach(createPhotoCard);

    $("status").textContent = "Painel carregado!";

  } catch (error) {

    console.error(error);

    $("status").textContent =
      "Erro ao carregar. Confira o Firebase.";
  }
}

$("addButton").addEventListener("click", () => {

  createPhotoCard({
    image: "",
    name: "",
    date: "",
    story: ""
  }, $("photos").children.length);

  renumberPhotos();
});

$("saveButton").addEventListener("click", async () => {

  $("status").textContent = "Salvando...";

  const data = {
    title: $("title").value.trim(),
    intro: $("intro").value.trim(),
    startDate: $("startDate").value,
    photos: readPhotos()
  };

  try {

    await setDoc(doc(db, "site", "config"), data);

    $("status").textContent =
      "Alterações salvas com sucesso! ❤️";

  } catch (error) {

    console.error(error);

    $("status").textContent =
      "Não foi possível salvar. Verifique as regras do Firebase.";
  }
});

load();

</script>

</body>
</html>
